name: Publish raw GitHub-hosted ULTRAKILL assets

on: [workflow_dispatch, push]

# Only one publisher may replace asset-host at a time. Queue newer runs; never cancel an active publish.
concurrency:
  group: publish-raw-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out game files
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Verify and split assets into GitHub-safe chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os
          from pathlib import Path

          sources = [
              Path("Build/WebGL.loader.js"),
              Path("Build/WebGL.data.unityweb"),
              Path("Build/WebGL.framework.js.unityweb"),
              Path("Build/WebGL.wasm.unityweb"),
          ] + [Path(p) for p in sorted(glob.glob("StreamingAssets/aa/WebGL/*.bundle"))]

          if len(sources) != 84:
              raise SystemExit(f"Expected 84 assets (4 runtime + 80 bundles), found {len(sources)}")

          stage = Path("/tmp/ultrakill-raw-stage")
          assets = stage / "assets"
          assets.mkdir(parents=True, exist_ok=True)
          manifest = {"files": {}}
          chunk_size = 45 * 1024 * 1024

          for src in sources:
              if not src.is_file() or src.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty asset: {src}")
              with src.open("rb") as inp:
                  chunks = []
                  number = 0
                  while True:
                      data = inp.read(chunk_size)
                      if not data:
                          break
                      chunk_name = f"{src.name}.part{number:03d}"
                      out = assets / chunk_name
                      out.write_bytes(data)
                      chunks.append(f"assets/{chunk_name}")
                      number += 1
              manifest["files"][src.name] = {
                  "size": src.stat().st_size,
                  "chunks": chunks
              }
              print(f"{src.name}: {src.stat().st_size:,} bytes -> {len(chunks)} chunk(s)")

          (stage / "manifest.json").write_text(json.dumps(manifest, separators=(",", ":")))
          print(f"Prepared {len(manifest['files'])} files in {sum(len(x['chunks']) for x in manifest['files'].values())} chunks")
          PY

      - name: Publish assets on a clean orphan branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan asset-host
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          mkdir -p assets
          cp /tmp/ultrakill-raw-stage/assets/* assets/
          cp /tmp/ultrakill-raw-stage/manifest.json manifest.json
          git add -f assets manifest.json
          git commit -m "Publish chunked ULTRAKILL WebGL assets"
          git push --force origin HEAD:asset-host

      - name: Rewrite the game to use the raw asset branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          import glob, json, os, re
          from pathlib import Path
          from urllib.parse import unquote, quote

          bundle_names = {Path(p).name for p in glob.glob("StreamingAssets/aa/WebGL/*.bundle")}
          if len(bundle_names) != 80:
              raise SystemExit(f"Expected 80 bundle names, found {len(bundle_names)}")

          catalog_path = Path("StreamingAssets/aa/catalog.json")
          catalog = json.loads(catalog_path.read_text())
          ids = catalog.get("m_InternalIds")
          if not isinstance(ids, list):
              raise SystemExit("catalog.json has no m_InternalIds array")

          repo_full = os.environ.get("GITHUB_REPOSITORY", "everyonesim/ultraport")
          owner, repo_name = repo_full.split("/", 1)
          base = f"https://{owner}.github.io/{repo_name}/asset-proxy/"
          base_rel = "asset-proxy/"
          changed = set()
          for i, value in enumerate(ids):
              if not isinstance(value, str):
                  continue
              filename = unquote(value.split("?", 1)[0].split("#", 1)[0].rsplit("/", 1)[-1])
              if filename in bundle_names:
                  ids[i] = base + quote(filename)
                  changed.add(filename)

          if changed != bundle_names:
              missing = sorted(bundle_names - changed)
              raise SystemExit(f"Catalog rewrite incomplete: changed {len(changed)}/80; missing={missing[:5]}")

          catalog_path.write_text(json.dumps(catalog, separators=(",", ":")))

          index_path = Path("index.html")
          html = index_path.read_text()
          runtime_urls = {
              "dataUrl": base_rel + "WebGL.data.unityweb?v=3",
              "frameworkUrl": base_rel + "WebGL.framework.js.unityweb",
              "codeUrl": base_rel + "WebGL.wasm.unityweb",
          }
          for key, value in runtime_urls.items():
              html, hits = re.subn(key + r':\s*"[^"]*"', key + ': "' + value + '"', html, count=1)
              if hits != 1:
                  raise SystemExit(f"Could not locate {key} in index.html")

          # Always normalize the loader URL, whether this is the first run or a rerun.
          html, loader_count = re.subn(
              r'var loaderUrl\s*=\s*[^;]+;',
              'var loaderUrl = "' + base_rel + 'WebGL.loader.js";',
              html,
              count=1
          )
          if loader_count != 1:
              raise SystemExit("Could not locate the Unity loader URL assignment")

          # Ensure loadUnityGame is async before inserting the worker wait.
          html = re.sub(r'(?<!async )function loadUnityGame\s*\(',
                        'async function loadUnityGame(', html, count=1)
          if "async function loadUnityGame(" not in html:
              raise SystemExit("Could not locate loadUnityGame()")

          # Add the worker helper only if absent.
          if "async function prepareAssetWorker()" not in html:
              helper = """
          async function prepareAssetWorker() {
            if (!("serviceWorker" in navigator)) throw new Error("This browser does not support service workers.");
            await navigator.serviceWorker.register("service-worker.js");
            await navigator.serviceWorker.ready;
            if (!navigator.serviceWorker.controller) {
              await new Promise(function(resolve, reject) {
                var timer = setTimeout(function() {
                  reject(new Error("The asset worker did not take control. Please reload and try again."));
                }, 20000);
                navigator.serviceWorker.addEventListener("controllerchange", function() {
                  clearTimeout(timer);
                  resolve();
                }, { once: true });
              });
            }
          }
          """
              html = html.replace("async function loadUnityGame(", helper + "\n      async function loadUnityGame(", 1)

          # Insert the wait only if it is not already inside the loader function.
          if "await prepareAssetWorker();" not in html:
              marker = '        loadingBar.style.display = "block";'
              if marker not in html:
                  raise SystemExit("Could not locate loading bar setup in loadUnityGame()")
              insertion = marker + """
                  try {
                    await prepareAssetWorker();
                  } catch (err) {
                    var errorText = loadingBar.querySelector("p");
                    if (!errorText) {
                      errorText = document.createElement("p");
                      loadingBar.appendChild(errorText);
                    }
                    errorText.textContent = "Asset setup failed: " + err.message;
                    booted = false;
                    return;
                  }"""
              html = html.replace(marker, insertion, 1)
          index_path.write_text(html)
          print("Rewrote 80 catalog bundle IDs, 3 Unity runtime URLs, and the Unity loader URL.")
          PY

          cat > service-worker.js <<'SW'
          const HOST = self.location.hostname;
          const SEGMENTS = self.location.pathname.split("/").filter(Boolean);
          const ACCOUNT = HOST.endsWith(".github.io") ? HOST.slice(0, -".github.io".length) : HOST;
          const REPO = SEGMENTS.length > 1 ? SEGMENTS[0] : "";
          const RAW_ROOT = "https://raw.githubusercontent.com/" + ACCOUNT + "/" + REPO + "/asset-host/";
          const PROXY_PATH = new URL(self.registration.scope).pathname + "asset-proxy/";

          self.addEventListener("install", event => event.waitUntil(self.skipWaiting()));
          self.addEventListener("activate", event => event.waitUntil(self.clients.claim()));

          let manifestPromise;
          function getManifest() {
            if (!manifestPromise) {
              manifestPromise = fetch(RAW_ROOT + "manifest.json")
                .then(response => {
                  if (!response.ok) throw new Error("Asset manifest HTTP " + response.status);
                  return response.json();
                });
            }
            return manifestPromise;
          }

          self.addEventListener("fetch", event => {
            const url = new URL(event.request.url);
            if (url.origin !== self.location.origin || !url.pathname.startsWith(PROXY_PATH)) return;

            event.respondWith((async () => {
              const filename = decodeURIComponent(url.pathname.slice(PROXY_PATH.length));
              if (!filename || filename.includes("/") || filename.includes("..")) {
                return new Response("Invalid asset name", { status: 400 });
              }

              const manifest = await getManifest();
              const file = manifest.files[filename];
              if (!file) return new Response("Asset not found: " + filename, { status: 404 });

              const parts = [];
              for (const chunk of file.chunks) {
                const response = await fetch(RAW_ROOT + chunk);
                if (!response.ok) throw new Error("Chunk fetch failed (" + response.status + "): " + chunk);
                parts.push(await response.arrayBuffer());
              }

              const type = filename.endsWith(".loader.js") || filename.includes("framework.js") ? "application/javascript" :
                filename.endsWith(".wasm.unityweb") ? "application/wasm" : "application/octet-stream";
              return new Response(new Blob(parts, { type }), {
                status: 200,
                headers: {
                  "Content-Type": type,
                  "Content-Length": String(file.size),
                  "Cache-Control": "public, max-age=31536000, immutable"
                }
              });
            })().catch(error => new Response("Asset proxy error: " + error.message, {
              status: 502,
              headers: { "Content-Type": "text/plain; charset=utf-8" }
            })));
          });
          SW

          python3 - <<'PY'
          import os, pathlib
          owner, repo = os.environ.get("GITHUB_REPOSITORY", "everyonesim/ultraport").split("/", 1)
          path = pathlib.Path("service-worker.js")
          path.write_text(path.read_text().replace("__OWNER__", owner).replace("__REPO__", repo))
          PY

          git add index.html StreamingAssets/aa/catalog.json service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Load Unity assets through CORS-enabled raw GitHub host"
          else
            echo "Game files already contain the asset proxy changes; nothing to commit."
          fi
          git push origin main
