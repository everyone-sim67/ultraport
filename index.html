      // it to the whole window, so everything Unity draws (splash logo included)
      // was scaled to 16:10 and looked stretched on any other aspect. Keep the
      // buffer equal to the displayed size instead, before the engine starts.
      function fitCanvasToDisplay() {
        var width = Math.max(1, Math.round(canvas.clientWidth || window.innerWidth));
        var height = Math.max(1, Math.round(canvas.clientHeight || window.innerHeight));
        if (canvas.width !== width || canvas.height !== height) {

          canvas.height = height;
        }

      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var hint = document.querySelector("#lock-hint");
      // Renderer path. A WebGL build can compile its particle and effect shaders
      // correctly for one graphics API and badly for the other, which shows up as
      // oversized particle quads and wrong textures. The path is switchable and
      // remembered: ?gl=1 forces WebGL1, ?gl=2 forces WebGL2, ?aa=0 drops MSAA.
      var params = new URLSearchParams(location.search);
      var glChoice = params.get("gl");
      if (glChoice === "1" || glChoice === "2") {
        try { localStorage.setItem("ultraport-gl", glChoice); } catch (err) {}
      } else {
        try { glChoice = localStorage.getItem("ultraport-gl"); } catch (err) {}
      }

        codeUrl: "asset-proxy/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Hakita",
        productName: "ULTRAKILL",
        productVersion: "4.1",
        matchWebGLToCanvasSize: true,
        autoSyncPersistentDataPath: true,

      // ------------------------------------------------------------------
      // Mouse capture. The port never asks for the lock and never signals whether
      // it is in a menu, so this shell owns the capture and drives it from input.
      // Turning is unlimited only while the pointer is captured, so capture is
      // attempted from every input the page can see, kept while playing, and
      // released by Esc, a double click, or the release key when a menu needs the
      // cursor back.
      // ------------------------------------------------------------------
      var nativeRequestPointerLock = Element.prototype.requestPointerLock ||
        Element.prototype.mozRequestPointerLock ||
        Element.prototype.webkitRequestPointerLock ||
        Element.prototype.msRequestPointerLock;

        Document.prototype.mozExitPointerLock ||
        Document.prototype.webkitExitPointerLock ||

      var needsGesture = false;
      var lastAttempt = 0;
      var lastActivity = Date.now();
      var idleWatch = null;
      var IDLE_RELEASE_MS = 6000;
      var RETRY_MS = 300;
      var graceUntil = 0;
      var userEscaped = false;
      // The port never tells us when it is in a menu, so play is entered by the
      // player's own movement input and left whenever the cursor is handed back.
      var playMode = false;
      var MOVE_KEY = /^(w|a|s|d|arrowup|arrowdown|arrowleft|arrowright|shift|control| )$/i;
      var escapeTimer = null;

      function lockedElement() {

          document.mozPointerLockElement ||
          document.webkitPointerLockElement ||
          document.msPointerLockElement ||
          null;

      function pointerIsLocked() {
        return lockedElement() === canvas;
      }

      function noteActivity() {
        lastActivity = Date.now();
      }

      function updateHint() {
        if (!hint) return;
        hint.style.display = (needsGesture && !pointerIsLocked()) ? "block" : "none";
      }

      function updateCursor() {
        if (!container) return;
        container.classList.toggle("cursor-forced", !pointerIsLocked());
      }

      function startIdleWatch() {}

      // Ask for the capture. Browsers only grant it from inside an input event, so
      // a refusal is normal and is retried by the next input and by the watchdog.
      function requestCapture(via) {
        if (pointerIsLocked()) return Promise.resolve();
        captureWanted = true;
        lastAttempt = Date.now();
        if (canvas.focus) {
          try { canvas.focus({ preventScroll: true }); } catch (err) { canvas.focus(); }
        }
        var result;
        try {
          result = nativeRequestPointerLock.call(canvas);
        } catch (err) {
          needsGesture = true;
          updateHint();
          return Promise.reject(err);
        }
        var pending = (result && typeof result.then === "function") ? result : null;
        if (!pending) {
          pending = new Promise(function(resolve, reject) {
            var settled = false;
            function settle() {
              if (settled) return;
              settled = true;
              if (pointerIsLocked()) resolve();
              else reject(new Error("pointer lock refused"));
            }
            document.addEventListener("pointerlockchange", settle);
            document.addEventListener("pointerlockerror", settle);
            setTimeout(settle, 400);
          });

        return pending.then(function() {
          needsGesture = false;
          noteActivity();
          startIdleWatch();
          updateCursor();
          updateHint();
        }, function(err) {
          if (!pointerIsLocked()) {
            needsGesture = true;
            updateCursor();
            updateHint();
          }
          throw err;
        });
      }

      function tryCapture() {
        if (!playMode) return;
        if (pointerIsLocked()) return;
        if (Date.now() - lastAttempt < 120) return;
        requestCapture("input").catch(function() {});
      }

      function releasePointer() {
        captureWanted = false;
        playMode = false;
        needsGesture = false;
        lastAttempt = 0;
        graceUntil = Date.now() + 1500;
        if (nativeExitPointerLock && pointerIsLocked()) {
          try { nativeExitPointerLock.call(document); } catch (err) {}
        }
        updateCursor();
        updateHint();
      }

      // The game's own lock calls, if it ever makes them, keep working.
      Element.prototype.requestPointerLock = function(options) {
        if (this === canvas) {
          captureWanted = true;
          return requestCapture("game").catch(function() {});
        }
        return nativeRequestPointerLock.apply(this, arguments);
      };
      Document.prototype.exitPointerLock = function() {
        // Nothing in this port ever asks for the lock to end, and a frame-by-frame
        // exit call from the game is exactly what kept dropping the capture, so
        // the game cannot release it. Esc still exits natively.
        if (captureWanted) return undefined;
        var out = nativeExitPointerLock.apply(this, arguments);
        return out;
      };

      // Retry watch: while a capture is wanted and not held, keep asking on a
      // timer, because any input in the meantime may have granted the gesture.
      setInterval(function() {
        if (!captureWanted || !playMode || pointerIsLocked()) return;
        if (Date.now() - lastAttempt < RETRY_MS) return;
        requestCapture("watchdog").catch(function() {});
      }, 400);

      // Every input the page can observe tries to capture.
      function onInput(event) {
        noteActivity();
        if (event && event.metaKey) return;
        if (event && event.key === "F8") return;   // toggle handles itself
        // Aiming motion should not grab the pointer back the moment Esc handed it
        // over; a click or a key still captures straight away.
        if (event && (event.type === "mousemove" || event.type === "wheel")) {
          if (Date.now() < graceUntil) return;
        }
        tryCapture();
      }

      canvas.addEventListener("pointerdown", onInput, true);
      canvas.addEventListener("mousedown", onInput, true);
      canvas.addEventListener("click", onInput, true);
      canvas.addEventListener("mousemove", onInput, true);
      canvas.addEventListener("wheel", onInput, { capture: true, passive: true });
      canvas.addEventListener("touchstart", onInput, true);
      canvas.addEventListener("contextmenu", function(event) {
        event.preventDefault();
        onInput(event);
      }, true);
      document.addEventListener("keydown", function(event) {
        if (event.key === "Escape" || event.key === "Esc") {
          // Only an Esc the player actually pressed may end the capture; any other
          // unlock is the page or the browser dropping it and gets re-grabbed.
          userEscaped = true;
          if (escapeTimer !== null) clearTimeout(escapeTimer);
          escapeTimer = setTimeout(function() { userEscaped = false; }, 800);
        }
        if (MOVE_KEY.test(event.key || "") && event.key !== "Control") {
          playMode = true;
        } else if (event.key === "Control" && !event.ctrlKey) {
          playMode = true;
        }
        if (event.metaKey || event.altKey || event.ctrlKey) return;
        onInput(event);
      }, true);

      // F8 toggles the capture as a manual escape hatch.
      document.addEventListener("keydown", function(event) {
        if (event.key !== "F8") return;
        event.preventDefault();
        if (pointerIsLocked()) releasePointer();
        else { captureWanted = true; requestCapture("toggle").catch(function() {}); }
      }, true);

      // Esc frees it natively; keep our state in step with whatever the browser did.
      document.addEventListener("pointerlockchange", function() {
        noteActivity();
        if (pointerIsLocked()) {
          needsGesture = false;
          startIdleWatch();
          updateCursor();
          updateHint();
          return;
        }
        if (userEscaped) {
          // The player wants the cursor: stay released until they give input.
          captureWanted = false;
          playMode = false;
          lastAttempt = 0;
          graceUntil = Date.now() + 1500;
          updateCursor();
          updateHint();
          return;
        }
        // Anything else dropped the capture without the player asking (the game
        // shutting it off, the browser reclaiming it): take it straight back.
        captureWanted = true;
        lastAttempt = 0;
        setTimeout(function() {
          if (!pointerIsLocked() && captureWanted && playMode) requestCapture("relock").catch(function() {});
        }, 30);
        updateCursor();
        updateHint();
      }, false);

      document.addEventListener("pointerlockerror", function() {
        needsGesture = !pointerIsLocked();
        updateCursor();
        updateHint();
      }, false);

      // A capture that survives a tab switch is stale; drop it and re-arm.
      window.addEventListener("blur", function(event) {
        // Only the window losing focus matters: focusing the canvas blurs the
        // element that had focus and must not drop the capture.
        if (event.target !== window) return;
        releasePointer();
      });

        if (document.hidden) releasePointer();
      });
      window.addEventListener("focus", function() {
        noteActivity();
      });

      // gesture). Silent when the browser refuses.
      var fullscreenAsked = false;
      function requestFullscreenOnce() {
        if (fullscreenAsked || document.fullscreenElement || document.webkitFullscreenElement) return;
        fullscreenAsked = true;

        var request = target.requestFullscreen || target.webkitRequestFullscreen || target.msRequestFullscreen;

          if (out && out.catch) out.catch(function() {});
        } catch (err) {}

      canvas.addEventListener("pointerdown", requestFullscreenOnce, true);
      canvas.addEventListener("keydown", requestFullscreenOnce, true);
      var startButton = document.getElementById("start-btn");
      if (startButton) startButton.addEventListener("click", requestFullscreenOnce, false);
      document.addEventListener("keydown", function(event) {
        if (event.key === "F11") requestFullscreenOnce();
      }, true);

      // Keep the game's keyboard focused and stop Chrome from taking keys it uses
      // for its own behaviour while playing.
      document.addEventListener("keydown", function(event) {
        if (!playMode) return;
        var key = event.key || "";
        if (key === "Tab" || key === " " || key === "Spacebar" || /^F([1-9]|1[0-2])$/.test(key)) {
          event.preventDefault();
        }
        if (event.ctrlKey && /^[fgjkp]$/i.test(key)) event.preventDefault();
      }, false);

      updateCursor();
      updateHint();
      var booted = false;
      var started = false;
      function startGame() {
        started = true;
        document.getElementById("indev-screen").style.display = "none";
        container.style.visibility = "visible";
        loadUnityGame();
      }
      document.getElementById("start-btn").addEventListener("click", startGame);
      window.addEventListener("beforeunload", function(e) {
        if (!started) return;
        e.preventDefault();
        e.returnValue = "";
        return "";
      });
      
async function prepareAssetWorker() {

  // poll for the controller as well as listening for controllerchange. Waiting on
  // the event alone could miss it and stall the load at 0%.
  var deadline = Date.now() + 20000;
  while (!navigator.serviceWorker.controller) {
    if (Date.now() > deadline) {
      throw new Error("The asset worker did not take control. Please reload and try again.");
    }
    await new Promise(function(resolve) {
      var settled = false;
      function finish() {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        navigator.serviceWorker.removeEventListener("controllerchange", finish);
        resolve();
      }
      var timer = setTimeout(finish, 200);
      navigator.serviceWorker.addEventListener("controllerchange", finish);
    });

      // ------------------------------------------------------------------
      // Starter save. ULTRAKILL keeps progress in BinaryFormatter files under
      // <persistentDataPath>/Saves/<slot>. The engine stores them in IndexedDB
      // (database "/idbfs", store FILE_DATA) under absolute engine paths.
      // The save is verified and reinstalled on every load, because the engine
      // can rewrite its slot as an empty profile on a fresh origin.
      var saveRootKey = "ultraport-save-root";
      var saveReloadKey = "ultraport-save-reloaded";

      function base64ToBytes(value) {
        var binary = atob(value);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      function loadStarterSave() {
        if (!loadStarterSave.promise) {
          loadStarterSave.promise = fetch("save/slot1.json", { cache: "no-store" })
            .then(function (response) { return response.ok ? response.json() : null; })
            .catch(function () { return null; });
        }
        return loadStarterSave.promise;
      }

      function openEngineStore() {
        return new Promise(function (resolve, reject) {
          var request;
          try { request = indexedDB.open("/idbfs", 21); } catch (err) { reject(err); return; }
          request.onupgradeneeded = function (event) {
            var db = event.target.result;
            var store = db.objectStoreNames.contains("FILE_DATA")
              ? event.target.transaction.objectStore("FILE_DATA")
              : db.createObjectStore("FILE_DATA");
            if (!store.indexNames.contains("timestamp")) {
              store.createIndex("timestamp", "timestamp", { unique: false });
            }
          };
          request.onerror = function () { reject(request.error); };
          request.onsuccess = function () { resolve(request.result); };
        });
      }

      function sameBytes(a, b) {
        if (!a || !b || a.length !== b.length) return false;
        for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
        return true;
      }

      // Reads the store once: finds the engine save folder, the slot it uses and
      // whether our generalprogress file is already in place.
      function inspectEngineSave(data) {
        return openEngineStore().then(function (db) {
          return new Promise(function (resolve) {
            var transaction;
            try { transaction = db.transaction("FILE_DATA", "readonly"); } catch (err) { resolve(null); return; }
            var store = transaction.objectStore("FILE_DATA");
            var keysRequest = store.getAllKeys();
            keysRequest.onerror = function () { resolve(null); };
            keysRequest.onsuccess = function () {
              var keys = keysRequest.result || [];
              var root = null;
              var slotDir = null;
              for (var i = 0; i < keys.length; i++) {
                var key = String(keys[i]);
                var cut = key.indexOf("/Saves");
                if (cut > 0 && !root) root = key.slice(0, cut);
                if (!slotDir) {
                  var match = key.match(/^(.*\/Saves\/[^\/]+)\//);
                  if (match) slotDir = match[1];
                }
                if (!root && key.indexOf("ultraport-probe") === -1) {
                  var bits = key.split("/").filter(Boolean);
                  if (bits.length >= 2 && bits[0] === "idbfs" && bits[1] !== "Saves") root = "/idbfs/" + bits[1];
                }
              }
              if (!root) {
                try { root = localStorage.getItem(saveRootKey); } catch (err) {}
              }
              if (!root) { resolve(null); return; }
              if (!slotDir) slotDir = root + "/Saves/Slot1";
              var wanted = slotDir + "/generalprogress.bepis";
              var probe = store.get(wanted);
              probe.onerror = function () { resolve({ root: root, slotDir: slotDir, installed: false }); };
              probe.onsuccess = function () {
                var record = probe.result;
                var bundled = data && data.files && data.files["generalprogress.bepis"]
                  ? base64ToBytes(data.files["generalprogress.bepis"])
                  : null;
                var installed = !!(record && record.contents && bundled && sameBytes(new Uint8Array(record.contents), bundled));
                resolve({ root: root, slotDir: slotDir, installed: installed });
              };
            };
          });
        }).catch(function () { return null; });
      }

      function writeStarterSave(data, root, slotDir) {
        return openEngineStore().then(function (db) {
          return new Promise(function (resolve) {
            var transaction;
            try { transaction = db.transaction("FILE_DATA", "readwrite"); } catch (err) { resolve(false); return; }
            var store = transaction.objectStore("FILE_DATA");
            try {
              store.put({ timestamp: new Date(), mode: 16877, contents: null }, root + "/Saves");
              store.put({ timestamp: new Date(), mode: 16877, contents: null }, slotDir);
              Object.keys(data.files).forEach(function (name) {
                store.put({ timestamp: new Date(), mode: 33206, contents: base64ToBytes(data.files[name]) }, slotDir + "/" + name);
              });
            } catch (err) { resolve(false); return; }
            transaction.oncomplete = function () { resolve(true); };
            transaction.onerror = function () { resolve(false); };
            transaction.onabort = function () { resolve(false); };
          });
        }).catch(function () { return false; });
      }

      // Runs before the engine boots, so a save written here is what it loads.
      async function seedStarterSaveBeforeBoot() {
        try {
          var data = await loadStarterSave();
          if (!data || !data.files) return;
          var state = await inspectEngineSave(data);
          if (!state) return;
          try { localStorage.setItem(saveRootKey, state.root); } catch (err) {}
          if (state.installed) return;
          await writeStarterSave(data, state.root, state.slotDir);
        } catch (err) {}
      }

      // Forces the engine to flush its filesystem, which is what reveals its
      // save folder when nothing has been persisted yet.
      function forceEnginePersist(instance) {
        var Module = instance && instance.Module;
        if (!Module || !Module.FS_createDataFile) return false;
        try {
          Module.FS_createDataFile("/idbfs", "ultraport-probe", new Uint8Array([1]), true, true, true);
          return true;
        } catch (err) {
          return false;
        }
      }

      // After boot: if the save was not in place for this load, install it and
      // reload once so the game picks it up.
      function installStarterSaveAfterBoot(instance) {
        var reloaded = false;
        try { reloaded = sessionStorage.getItem(saveReloadKey) === "1"; } catch (err) {}
        if (reloaded) return;
        loadStarterSave().then(function (data) {
          if (!data || !data.files) return;
          var attempts = 0;
          function attempt() {
            forceEnginePersist(instance);
            inspectEngineSave(data).then(function (state) {
              if (!state) {
                attempts++;
                if (attempts < 120) setTimeout(attempt, 2000);
                return;
              }
              try { localStorage.setItem(saveRootKey, state.root); } catch (err) {}
              if (state.installed) return;
              writeStarterSave(data, state.root, state.slotDir).then(function (ok) {
                if (!ok) return;
                try { sessionStorage.setItem(saveReloadKey, "1"); } catch (err) {}
                location.reload();
              });
            });
          }
          setTimeout(attempt, 1200);
        });
      }

      async function loadUnityGame() {
        if (booted) return;
        booted = true;
        loadingBar.style.display = "block";
        try {
          await prepareAssetWorker();
          await seedStarterSaveBeforeBoot();
        } catch (err) {
          var errorText = loadingBar.querySelector("p");
          if (!errorText) {
            errorText = document.createElement("p");
            loadingBar.appendChild(errorText);
          }
          errorText.textContent = "Asset setup failed: " + err.message;
          booted = false;
          return;
        }
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function() {
          createUnityInstance(canvas, config, function(progress) {
            progressBarFull.style.width = 100 * progress + "%";
          }).then(function(unityInstance) {
            loadingBar.style.display = "none";
            installStarterSaveAfterBoot(unityInstance);
            updateHint();
            unityInstance.SetFullscreen = function() {
              return 0;
            };
          }).catch(function(message) {
            var m = loadingBar.querySelector("p");
            if (!m) {
              m = document.createElement("p");
              loadingBar.appendChild(m);
            }
            m.textContent = message;
          });
        };
        script.onerror = function() {
          var m = loadingBar.querySelector("p");
          if (!m) {
            m = document.createElement("p");
            loadingBar.appendChild(m);
          }
          m.textContent = "Could not load Unity loader script. Check the asset proxy.";
          booted = false;
        };
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
